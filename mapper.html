    <style>
        /* ============================================================
           THEME: CHART ROOM / NAVIGATION LOGBOOK
           Deep navy, amber brass, copper-green range fills
           ============================================================ */
        :root {
            --bg-deep:    #0b1a2e;
            --bg-panel:   #0f2440;
            --bg-card:    #132d52;
            --bg-input:   #0a1628;
            --border:     #1e3a5f;
            --border-hl:  #3a6080;
            --amber:      #e8b44b;
            --amber-dim:  #a07828;
            --copper:     #c4875a;
            --green:      #5a9e7c;
            --green-dim:  #3a6a52;
            --text:       #d4cfc4;
            --text-dim:   #8a8578;
            --text-muted: #5a564d;
            --error:      #c46060;
            --font-display: 'Playfair Display', 'Noto Serif SC', Georgia, serif;
            --font-ui:      'DM Sans', 'Noto Sans SC', -apple-system, sans-serif;
            --font-mono:    'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        html, body { height:100%; overflow:hidden; }

        body {
            font-family: var(--font-ui);
            background: var(--body-bg);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* ── PANEL ── */
        #panel {
            width: 390px;
            min-width: 390px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            color: var(--text);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
            position: relative;
        }
        #panel::-webkit-scrollbar { width:5px; }
        #panel::-webkit-scrollbar-track { background:transparent; }
        #panel::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

        /* panel inner */
        .panel-inner {
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        /* ── NAV ── */
        .nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
        .nav a{color:var(--text-dim);text-decoration:none;font-size:11px;padding:3px 8px;border-radius:4px;transition:all .2s;letter-spacing:.5px}
        .nav a:hover{color:var(--text);background:var(--bg-card)}
        .nav a.active{color:var(--amber);background:var(--bg-card)}

        /* ── HEADER ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 34px; height: 34px;
            border: 2px solid var(--amber);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .logo-icon::after {
            content: ''; width: 8px; height: 8px;
            background: var(--amber);
            border-radius: 50%;
        }
        .logo-text h2 {
            font-family: var(--font-display);
            font-size: 20px;
            color: var(--text);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: 0.5px;
        }
        .logo-text span {
            font-size: 10px;
            color: var(--text-dim);
            font-family: var(--font-ui);
            font-weight: 400;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* ── LANG SWITCH ── */
        .lang-switch {
            display: flex;
            gap: 2px;
            background: var(--bg-input);
            border-radius: 6px;
            padding: 2px;
            border: 1px solid var(--border);
        }
        .lang-switch button {
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-ui);
            transition: all 0.2s;
            background: transparent;
            color: var(--text-dim);
        }
        .lang-switch button.active {
            background: var(--amber);
            color: var(--bg-deep);
        }
        .lang-switch button:hover:not(.active) {
            color: var(--text);
        }

        /* ── SECTION TITLES ── */
        .sec-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--amber-dim);
            font-family: var(--font-ui);
        }

        /* ── INPUTS ── */
        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-field {
            flex:1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .input-field label {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .input-field input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-input);
            color: var(--text);
            font-size: 14px;
            font-family: var(--font-mono);
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .input-field input:focus {
            border-color: var(--amber);
            box-shadow: 0 0 0 3px rgba(232,180,75,0.1);
        }
        .input-field input::placeholder {
            color: var(--text-muted);
            font-family: var(--font-ui);
        }

        /* ── BUTTONS ── */
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-ui);
            transition: all 0.2s;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 50%);
            pointer-events: none;
        }
        .btn:active { transform: scale(0.97); }
        .btn-amber {
            background: var(--amber);
            color: var(--bg-deep);
        }
        .btn-amber:hover { background: #f0c860; box-shadow: 0 2px 12px rgba(232,180,75,0.25); }
        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
        }
        .btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }
        .btn-green {
            background: var(--green);
            color: var(--bg-deep);
        }
        .btn-green:hover { background: #68b68e; box-shadow: 0 2px 12px rgba(90,158,124,0.25); }
        .btn-copper {
            background: transparent;
            border: 1px solid var(--copper);
            color: var(--copper);
        }
        .btn-copper:hover { background: rgba(196,135,90,0.1); }
        .btn-row {
            display: flex;
            gap: 8px;
        }
        .btn-row .btn { flex:1; min-width: 80px; text-align: center; }

        /* ── BATCH ── */
        .batch-header {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }
        .batch-header .chevron {
            transition: transform 0.25s;
            font-size: 10px;
            color: var(--text-dim);
        }
        .batch-header.open .chevron { transform: rotate(90deg); }
        .batch-body { display: none; flex-direction: column; gap: 8px; }
        .batch-body.open { display: flex; }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-input);
            color: var(--text);
            font-size: 13px;
            font-family: var(--font-mono);
            outline: none;
            resize: vertical;
            line-height: 1.7;
            min-height: 120px;
            transition: border-color 0.25s;
        }
        textarea:focus { border-color: var(--amber); }
        textarea::placeholder { color: var(--text-muted); font-family: var(--font-ui); }

        /* ── DIVIDER ── */
        .hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 4px 0;
        }

        /* ── COORD LIST ── */
        .coord-list-header {
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .coord-list-header .count { color: var(--amber); }
        .coord-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 260px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        .coord-empty {
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
            padding: 24px 0;
            line-height: 1.6;
        }
        .coord-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--bg-card);
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 13px;
            animation: slideIn 0.2s ease;
        }
        @keyframes slideIn {
            from { opacity:0; transform: translateX(-8px); }
            to   { opacity:1; transform: translateX(0); }
        }
        .coord-item .idx {
            color: var(--amber);
            font-weight: 700;
            font-family: var(--font-mono);
            font-size: 11px;
            min-width: 22px;
        }
        .coord-item .dms {
            flex: 1;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text);
            letter-spacing: 0.5px;
        }
        .coord-item .del {
            background: none;
            border: none;
            color: var(--error);
            cursor: pointer;
            font-size: 16px;
            padding: 0 2px;
            opacity: 0.6;
            transition: opacity 0.2s;
            line-height: 1;
        }
        .coord-item .del:hover { opacity: 1; }

        /* ── AREA ── */
        .area-box {
            font-size: 13px;
            padding: 10px 12px;
            background: rgba(90,158,124,0.08);
            border: 1px solid rgba(90,158,124,0.25);
            border-radius: 6px;
            color: var(--green);
            font-family: var(--font-mono);
            display: none;
        }
        .area-box.visible { display: block; }

        /* ── ERROR ── */
        .error-box {
            font-size: 11px;
            padding: 8px 12px;
            background: rgba(196,96,96,0.08);
            border-radius: 6px;
            color: var(--error);
            font-family: var(--font-mono);
            white-space: pre-wrap;
            display: none;
        }
        .error-box.visible { display: block; }

        /* ── AD SLOT ── */
        .ad-slot {
            min-height: 250px;
            background: var(--bg-card);
            border: 1px dashed var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: auto;
        }

        /* ── HINT ── */
        .hint {
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.7;
        }
        .hint b { color: var(--text); }

        /* ── MAP ── */
        #map {
            flex: 1;
            height: 100vh;
            background: var(--body-bg);
        }

        /* Leaflet overrides */
        .leaflet-control-zoom a {
            background: var(--bg-card) !important;
            color: var(--text) !important;
            border-color: var(--border) !important;
        }
        .leaflet-control-attribution {
            background: rgba(15,36,64,0.85) !important;
            color: var(--text-dim) !important;
            font-size: 10px !important;
        }
        .leaflet-control-attribution a { color: var(--amber) !important; }
        .leaflet-popup-content-wrapper {
            background: var(--bg-card) !important;
            color: var(--text) !important;
            border: 1px solid var(--border) !important;
            border-radius: 8px !important;
        }
        .leaflet-popup-tip { background: var(--bg-card) !important; }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #panel {
                width: 100%; min-width: unset;
                max-height: 48vh;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            #map { height: 52vh; }
            .logo-text h2 { font-size: 17px; }
        }

        /* ── GEO FOOTER (below panel, SEO text) ── */
        .geo-footer {
            padding: 20px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.7;
            flex-shrink: 0;
        }
        .geo-footer h3 {
            font-family: var(--font-display);
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 6px;
        }
        .geo-footer a { color: var(--amber-dim); text-decoration: none; }
        .geo-footer a:hover { text-decoration: underline; }
    </style>

</head>

            emptyHint: 'Enter coordinates above,\nor click directly on the map',
            btnClose: '🔒 Close Polygon',
            btnExport: '📥 Export GeoJSON',
            areaText: '📐 Range area approx: ',
            perimeterText: '📏 Perimeter: ',
            closedTag: ' (closed)',
            unclosedTag: ' (unclosed)',
            hintTitle: '💡 Tips',
            hint1: 'Supports <b>DMS format</b> (23-41.31N) or <b>decimal</b> (23.6885)',
            hint2: '<b>Batch input</b>: one pair per line, any delimiter',
            hint3: 'You can also <b>click on the map</b> to add points',
            hint4: 'Click <b>×</b> to delete; <b>Close</b> to connect last to first',
            alertNeed3: 'At least 3 points required to form a polygon!',
            alertInvalid: 'Invalid coordinate format!\nSupported: DMS (117-31.49E) or decimal (117.524)',
            alertLngRange: 'Longitude must be between -180 and 180!',
            alertLatRange: 'Latitude must be between -90 and 90!',
            alertEmpty: 'Please enter longitude and latitude!',
            alertNoValid: 'No valid coordinates found!',
            alertClearConfirm: 'Clear all points?',
            parseWarn: '⚠ Parse warning:',
            parseError: '⚠ Parse error:',
            partialFail: '⚠ Partially failed:',
            batchEmpty: 'Batch input is empty',
            lineFail: 'Cannot parse',
            footerTitle: 'About This Tool',
            footerText: 'Coordinate Range Mapper is a free online map annotation tool. It supports DMS format (23-41.31N) and decimal coordinate input, batch point addition, automatic polygon closure, and real-time area calculation. Ideal for maritime navigation, outdoor surveying, and land planning. Built with the open-source Leaflet library and OpenStreetMap data. No registration, no API key required.<br><br><a href="https://github.com" target="_blank" rel="noopener">Open Source on GitHub</a> · <a href="/sitemap.xml">Sitemap</a>',
            adLabel: 'Advertisement',
            line: 'Line ',
            lineCantParse: ': cannot parse',
        }
    };

    /* ================================================================
       STATE
       ================================================================ */
    let points = [];
    let _polygonClosed = false;
    let _panelScroll = 0;
    let _langChangeHandler = null;
    let currentLang = 'en';

    /* ================================================================
       DETECT LANGUAGE
       ================================================================ */
    (function initLang() {
        const urlParams = new URLSearchParams(window.location.search);
        const urlLang = urlParams.get('lang');
        if (urlLang === 'en' || urlLang === 'zh') {
            currentLang = urlLang;
        } else {
            const nav = (navigator.language || '').toLowerCase();
            currentLang = urlLang === 'zh' ? 'zh' : 'en';
        }
        document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
    })();

    function t(key) {
        return I18N[currentLang][key] || I18N['zh'][key] || key;
    }

    /* ================================================================
       MAP
       ================================================================ */
    const map = L.map('map').setView([30, 0], 2);
    let _userInteracted = false;
    map.on('movestart', () => { _userInteracted = true; });
    map.on('zoomstart', () => { _userInteracted = true; });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19,
    }).addTo(map);

    // 尝试定位到用户位置
    if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                map.setView([pos.coords.latitude, pos.coords.longitude], 12);
                L.circleMarker([pos.coords.latitude, pos.coords.longitude], {
                    radius: 8, color: '#5a9e7c', fillColor: '#5a9e7c', fillOpacity: 0.6, weight: 2
                }).addTo(map).bindTooltip('You are here', { direction: 'top' });
            },
            function() { /* 用户拒绝或无 GPS，保持世界视图 */ },
            { timeout: 5000, enableHighAccuracy: false }
        );
    }

    const markersLayer = L.layerGroup().addTo(map);
    const polygonLayer = L.layerGroup().addTo(map);
    const linesLayer = L.layerGroup().addTo(map);

    /* ================================================================
       COORD PARSING
       ================================================================ */
    function parseCoord(raw) {
        const s = raw.trim();
        if (!s) return null;
        const dmsRe = /^([+-]?\d+(?:\.\d+)?)\s*[-°\s]*\s*(\d+(?:\.\d+)?)\s*['′]?\s*([NSEWnsew])?$/;
        const m = s.match(dmsRe);
        if (m) {
            const deg = parseFloat(m[1]), min = parseFloat(m[2]);
            const dir = (m[3] || '').toUpperCase();
            let val = deg + min / 60;
            if (dir === 'S' || dir === 'W') val = -val;
            return Number(val.toFixed(6));
        }
        const decRe = /^([+-]?\d+(?:\.\d+)?)\s*([NSEWnsew])?$/;
        const dm = s.match(decRe);
        if (dm) {
            const val = parseFloat(dm[1]);
            const dir = (dm[2] || '').toUpperCase();
            if (dir === 'S' || dir === 'W') return Number((-Math.abs(val)).toFixed(6));
            if (dir === 'N' || dir === 'E') return Number(Math.abs(val).toFixed(6));
            return Number(val.toFixed(6));
        }
        const num = parseFloat(s);
        if (!isNaN(num)) return Number(num.toFixed(6));
        return null;
    }

    function parseLatLngLine(line) {
        const trimmed = line.trim();
        if (!trimmed) return null;
        const parts = trimmed.split(/[,，、;；\t]+|\s{2,}/);
        if (parts.length < 2) return null;
        const filtered = parts.map(p => p.trim()).filter(p => p);
        if (filtered.length < 2) return null;
        let latPart, lngPart;
        const p0Up = filtered[0].toUpperCase();
        const p1Up = filtered[1].toUpperCase();
        const p0NS = p0Up.includes('N')||p0Up.includes('S');
        const p0EW = p0Up.includes('E')||p0Up.includes('W');
        const p1NS = p1Up.includes('N')||p1Up.includes('S');
        const p1EW = p1Up.includes('E')||p1Up.includes('W');
        if (p0NS && p1EW) { latPart=filtered[0]; lngPart=filtered[1]; }
        else if (p0EW && p1NS) { lngPart=filtered[0]; latPart=filtered[1]; }
        else if (p0NS) { latPart=filtered[0]; lngPart=filtered[1]; }
        else if (p0EW) { lngPart=filtered[0]; latPart=filtered[1]; }
        else if (p1NS) { latPart=filtered[1]; lngPart=filtered[0]; }
        else if (p1EW) { lngPart=filtered[1]; latPart=filtered[0]; }
        else {
            latPart=filtered[0]; lngPart=filtered[1];
            const lv=parseFloat(latPart), lnv=parseFloat(lngPart);
            if (!isNaN(lv)&&!isNaN(lnv)&&Math.abs(lv)>90&&Math.abs(lnv)<=90)
                [latPart,lngPart]=[lngPart,latPart];
        }
        const lat = parseCoord(latPart), lng = parseCoord(lngPart);
        if (lat===null||lng===null) return null;
        if (lat<-90||lat>90) return null;
        if (lng<-180||lng>180) return null;
        return {lat,lng};
    }

    function formatDMS(lng,lat) {
        const to= (v,pos,neg) => {
            const dir=v>=0?pos:neg;
            const a=Math.abs(v);
            const d=Math.floor(a);
            const m=((a-d)*60).toFixed(2);
            return d+'-'+m.padStart(5,'0')+dir;
        };
        return to(lat,'N','S')+', '+to(lng,'E','W');
    }

    /* ================================================================
       AREA
       ================================================================ */
    function calcArea(pts) {
        if (pts.length<3) return null;
        let a=0; const n=pts.length;
        for(let i=0;i<n;i++){
            const j=(i+1)%n;
            const lm=(pts[i].lat+pts[j].lat)/2;
            const s=Math.cos(lm*Math.PI/180);
            a+=pts[i].lng*s*pts[j].lat - pts[j].lng*s*pts[i].lat;
        }
        a=Math.abs(a/2)*111.32*111.32;
        return a;
    }
    function fmtArea(km2) {
        return km2>=1?km2.toFixed(2)+' km²':(km2*1e6).toFixed(0)+' m²';
    }
    function calcPerimeter(pts) {
        if (pts.length<2) return null;
        let total=0; const n=pts.length;
        for(let i=0;i<n;i++){
            const j=(i+1)%n;
            total+=L.latLng(pts[i].lat,pts[i].lng).distanceTo(L.latLng(pts[j].lat,pts[j].lng));
        }
        return total;
    }
    function fmtDist(m) {
        return m>=1000?(m/1000).toFixed(2)+' km':m.toFixed(0)+' m';
    }
    function exportGeoJSON() {
        const features=[],coords=points.map(p=>[p.lng,p.lat]);
        features.push({type:'Feature',geometry:{type:'MultiPoint',coordinates:coords},properties:{type:'points'}});
        if (points.length>=3) {
            const ring=[...coords,coords[0]];
            features.push({type:'Feature',geometry:{type:'Polygon',coordinates:[ring]},properties:{area_km2:calcArea(points),perimeter_m:calcPerimeter(points)}});
        }
        const geojson={type:'FeatureCollection',features};
        const blob=new Blob([JSON.stringify(geojson,null,2)],{type:'application/geo+json'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');a.href=url;a.download='coordinates.geojson';a.click();
        URL.revokeObjectURL(url);
    }

    /* ================================================================
       RENDER MAP
       ================================================================ */
    function renderMap() {
        markersLayer.clearLayers();
        linesLayer.clearLayers();
        polygonLayer.clearLayers();
        if (!points.length) return;
        const latlngs=[];
        points.forEach((p,i)=>{
            const ll=[p.lat,p.lng]; latlngs.push(ll);
            const clr=i===points.length-1?'#c46060':'var(--amber)';
            L.marker(ll,{icon:L.divIcon({
                html:'<div style="background:'+clr+';color:#0b1a2e;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border:2px solid #0b1a2e;box-shadow:0 2px 8px rgba(0,0,0,0.4);font-family:\'JetBrains Mono\',monospace;">'+(i+1)+'</div>',
                className:'',iconSize:[26,26],iconAnchor:[13,13]
            })}).addTo(markersLayer)
            .bindTooltip('#'+(i+1)+': '+formatDMS(p.lng,p.lat),{direction:'top'});
        });
        if (points.length>=2) L.polyline(latlngs,{color:'#e8b44b',weight:2,dashArray:'8 4',opacity:.8}).addTo(linesLayer);
        if (points.length>=3) {
            const closed=_polygonClosed;
            L.polygon(closed?[...latlngs,latlngs[0]]:latlngs,{
                color:'#5a9e7c',weight:2,fillColor:'#5a9e7c',
                fillOpacity:closed ? .25 : .06,dashArray:closed?'':'4 2'
            }).addTo(polygonLayer);
        }
        // Only auto-fit when user hasn't manually panned/zoomed (first render or batch replace)
        if (latlngs.length && !_userInteracted) map.fitBounds(L.latLngBounds(latlngs),{padding:[40,40],maxZoom:16});
    }

    /* ================================================================
       RENDER PANEL (pure JS, i18n-driven)
       ================================================================ */
    function renderPanel() {
        const panel = document.getElementById('panel');
        const savedScroll = _panelScroll;
        const closed = _polygonClosed;
        const area = calcArea(points);
        const perimeter = calcPerimeter(points);
        const areaStr = area!==null ? fmtArea(area) : '';
        const perimeterStr = perimeter!==null ? fmtDist(perimeter) : '';

        panel.innerHTML = `
        <div class="panel-inner">
            <!-- Header -->
            <div class="header">
                <div class="logo">
                    <div class="logo-icon"></div>
                    <div class="logo-text">
                        <h2>${t('title')}</h2>
                        <span>${t('version')}</span>
                    </div>
                </div>
            </div>

            <!-- Single Input -->
            <div class="sec-title">${t('singleTitle')}</div>
            <div class="input-row">
                <div class="input-field">
                    <label>${t('lngLabel')}</label>
                    <input type="text" id="inputLng" placeholder="${t('lngPh')}" />
                </div>
                <div class="input-field">
                    <label>${t('latLabel')}</label>
                    <input type="text" id="inputLat" placeholder="${t('latPh')}" />
                </div>
            </div>
            <div class="btn-row">
                <button class="btn btn-amber" id="btnAdd">${t('btnAdd')}</button>
                <button class="btn btn-ghost" id="btnClear">${t('btnClear')}</button>
            </div>

            <div class="hr"></div>

            <!-- Batch Input -->
            <div class="batch-header ${_batchOpen?'open':''}" id="batchHeader">
                <span class="chevron">▶</span> <span class="sec-title">${t('batchTitle')}</span>
                <span style="font-size:10px;color:var(--text-muted);">${_batchOpen?t('batchCollapse'):t('batchExpand')}</span>
            </div>
            <div class="batch-body ${_batchOpen?'open':''}" id="batchBody">
                <textarea id="batchInput" placeholder="${t('batchPh').replace(/\n/g,'&#10;')}"></textarea>
                <div class="btn-row">
                    <button class="btn btn-amber" id="btnBatchAdd">${t('btnBatchAdd')}</button>
                    <button class="btn btn-copper" id="btnBatchReplace">${t('btnBatchReplace')}</button>
                </div>
            </div>

            <div class="hr"></div>

            <!-- Point List -->
            <div class="coord-list-header">
                <span>${t('pointsTitle')}</span>
                <span class="count">${points.length} ${t('pointUnit')}</span>
            </div>
            <div class="coord-list" id="coordList">
                ${points.length===0 ? `<div class="coord-empty">${t('emptyList')}<br>${t('emptyHint')}</div>` :
                points.map((p,i)=>`
                    <div class="coord-item">
                        <span class="idx">#${i+1}</span>
                        <span class="dms">${formatDMS(p.lng,p.lat)}</span>
                        <button class="del" data-del="${i}">×</button>
                    </div>`).join('')}
            </div>

            <div class="btn-row">
                <button class="btn btn-green" id="btnClosePolygon">${t('btnClose')}</button>
                <button class="btn btn-copper" id="btnExport">${t('btnExport')}</button>
            </div>

            <!-- Area -->
            <div class="area-box ${area!==null?'visible':''}" id="areaBox">
                ${area!==null ? t('areaText')+areaStr+(closed?t('closedTag'):t('unclosedTag')) : ''}${perimeter!==null ? '<br>'+t('perimeterText')+perimeterStr : ''}
            </div>

            <!-- Error -->
            <div class="error-box" id="errorBox"></div>

            <!-- Hint -->
            <div class="hint">
                ${t('hintTitle')}<br>
                • ${t('hint1')}<br>
                • ${t('hint2')}<br>
                • ${t('hint3')}<br>
                • ${t('hint4')}
            </div>

            <!-- Ad Slot -->
            <div style="margin-top:auto;">
                <!-- AdSense disabled during review: JS-rendered page -->
            <!--
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7515870770543020" data-ad-slot="6409255977" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});<\/script>
            -->
            </div>
        </div>

        <!-- GEO Footer -->
        <div class="geo-footer">
            <h3>${t('footerTitle')}</h3>
            <p>${t('footerText')}</p>
        </div>`;

        // rebind events
        bindEvents();
        // Restore scroll after full layout (double rAF). Using _panelScroll
        // because panel.scrollTop is 0 right after innerHTML replacement.
        requestAnimationFrame(() => {
            requestAnimationFrame(() => { panel.scrollTop = savedScroll; });
        });
    }

    let _batchOpen = false;

    /* ================================================================
       EVENT BINDING
       ================================================================ */
    function bindEvents() {
        const $ = (id) => document.getElementById(id);

        // Lang switch (remove old listener to avoid accumulation)
        if (_langChangeHandler) window.removeEventListener('langchange', _langChangeHandler);
        _langChangeHandler = (e) => {
            currentLang = e.detail;
            document.documentElement.lang = currentLang==='zh'?'zh-CN':'en';
            renderPanel();
            renderMap();
        };
        window.addEventListener('langchange', _langChangeHandler);

        // Add single point
        $('btnAdd').addEventListener('click', () => {
            const lngS = $('inputLng').value.trim();
            const latS = $('inputLat').value.trim();
            if (!lngS || !latS) { alert(t('alertEmpty')); return; }
            const lng = parseCoord(lngS), lat = parseCoord(latS);
            if (lng===null || lat===null) { alert(t('alertInvalid')); return; }
            if (lng<-180||lng>180) { alert(t('alertLngRange')+' '+lng); return; }
            if (lat<-90||lat>90) { alert(t('alertLatRange')+' '+lat); return; }
            points.push({lng,lat});
            _polygonClosed = false;
            renderAll();
            $('inputLng').value=''; $('inputLat').value='';
            $('inputLng').focus();
        });

        $('inputLat').addEventListener('keydown', e => { if(e.key==='Enter') $('btnAdd').click(); });
        $('inputLng').addEventListener('keydown', e => { if(e.key==='Enter') $('inputLat').focus(); });

        // Clear
        $('btnClear').addEventListener('click', () => {
            if (points.length===0) return;
            if (confirm(t('alertClearConfirm'))) {
                points=[]; _polygonClosed=false; renderAll();
            }
        });

        // Close polygon
        $('btnClosePolygon').addEventListener('click', () => {
            if (points.length<3) { alert(t('alertNeed3')); return; }
            _polygonClosed=true; renderAll();
        });

        // Export GeoJSON
        $('btnExport').addEventListener('click', () => {
            if (points.length<3 && !_polygonClosed) { alert(t('alertNeed3')); return; }
            exportGeoJSON();
        });

        // Batch header toggle
        $('batchHeader').addEventListener('click', () => {
            _batchOpen = !_batchOpen;
            // just re-render panel (preserve batch textarea content)
            const el = $('batchInput'); const batchText = el ? el.value : '';
            renderPanel();
            if (_batchOpen && $('batchInput')) $('batchInput').value = batchText;
        });

        // Batch add
        $('btnBatchAdd').addEventListener('click', () => {
            const result = parseBatch();
            showError(result.errors, 'warn');
            if (result.points.length) {
                points.push(...result.points);
                _polygonClosed=false; renderAll();
            } else if (result.errors.length===0) {
                alert(t('alertNoValid'));
            }
        });

        // Batch replace
        $('btnBatchReplace').addEventListener('click', () => {
            const result = parseBatch();
            if (!result.points.length) {
                showError(result.errors, 'error');
                if (result.errors.length===0) alert(t('alertNoValid'));
                return;
            }
            points = result.points;
            _polygonClosed=false;
            _userInteracted = false; // allow map to re-fit after batch replace
            renderAll();
            showError(result.errors, 'warn');
        });

        // Delete point
        document.querySelectorAll('[data-del]').forEach(btn => {
            btn.addEventListener('click', e => {
                e.stopPropagation();
                const idx = parseInt(btn.dataset.del);
                if (idx>=0 && idx<points.length) {
                    points.splice(idx,1);
                    if (points.length<3) _polygonClosed=false;
                    renderAll();
                }
            });
        });
    }

    function parseBatch() {
        const ta = document.getElementById('batchInput');
        const text = ta ? ta.value.trim() : '';
        const result = { points:[], errors:[] };
        if (!text) { result.errors.push(t('batchEmpty')); return result; }
        text.split(/\r?\n/).forEach((line,i) => {
            const p = parseLatLngLine(line);
            if (p) result.points.push(p);
            else if (line.trim()) result.errors.push(t('line')+(i+1)+t('lineCantParse')+': "'+line.trim()+'"');
        });
        return result;
    }

    function showError(errors, level) {
        const box = document.getElementById('errorBox');
        if (!box) return;
        if (!errors.length) { box.classList.remove('visible'); return; }
        box.classList.add('visible');
        const prefix = level==='error'?t('parseError'):t('parseWarn');
        box.textContent = prefix+'\n'+errors.join('\n');
    }

    function renderAll() {
        renderPanel();
        renderMap();
    }

    // Map click
    map.on('click', e => {
        const {lat,lng}=e.latlng;
        points.push({lng:Number(lng.toFixed(6)),lat:Number(lat.toFixed(6))});
        _polygonClosed=false;
        renderAll();
        // update single inputs
        const il=document.getElementById('inputLng');
        const ila=document.getElementById('inputLat');
        if(il)il.value=lng.toFixed(6);
        if(ila)ila.value=lat.toFixed(6);
    });

    // Track panel scroll position so it survives innerHTML resets
    (function() {
        const panel = document.getElementById('panel');
        panel.addEventListener('scroll', () => { _panelScroll = panel.scrollTop; }, { passive: true });
    })();

    // Init
    renderAll();
    </script>

    <script src="/shared.js"></script>

</body>
</html>
